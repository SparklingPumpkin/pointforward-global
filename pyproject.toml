[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointforward-global"
version = "5.0.0"
description = "Global Gaussian reconstruction with accepted LIM-v1-r preprocessing"
requires-python = ">=3.9,<3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pointforward*"]

[tool.setuptools.package-data]
pointforward_calibration = ["*.json"]
