[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointforward-global"
version = "2.0.0"
description = "PFG-v2 fast global-Gaussian training and inference delivery"
requires-python = ">=3.9,<3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pointforward*"]
